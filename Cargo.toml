[workspace]
members = ["."]

[package]
name = "vulnhash"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
rpassword = "5"

# Crypto
sha2 = "0.10"
hex = "0.4"

# HTTP & Tor (via shared crate)
vulnhash-crypto = { path = "crates/vulnhash-crypto" }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Web UI server
axum = "0.8"
rust-embed = "8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
mime_guess = "2"

# Config dir
dirs = "6"
