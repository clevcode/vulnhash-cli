name: release

# Builds the CLI for every supported platform and uploads the binaries as
# workflow artifacts.
#
# Two of the six platforms cannot be produced on a Linux box, which is why this
# exists.
#
# macOS is not about libSystem — zig ships that, and `cargo zigbuild` compiles
# the whole tree. The link fails for want of the IOKit and CoreFoundation
# framework stubs, which live in the macOS SDK; and current SDKs list only
# `arm64e-macos` among their stub targets, which zig will not match against
# plain arm64. A macOS runner sidesteps both.
#
# Windows arm64 has no aarch64 import library for `synchronization` anywhere
# outside a Windows toolchain — not in zig's mingw tree, not in the
# windows_aarch64_gnullvm crate, for `-gnu` or `-gnullvm` alike.
#
# The rest could be cross-compiled locally with `make release`, but are built
# here too so one run yields a complete set.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: darwin-amd64
            os: macos-latest
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # ring compiles its C with clang for aarch64-windows, and clang needs the
      # MSVC environment to find the arm64 headers and import libraries. Built
      # without it, the build fails as `failed to find tool "clang"`; built
      # with clang but no environment, it fails inside curve25519.c instead.
      #
      # Done inline rather than through a third-party action: this pipeline
      # produces signed binaries, and every action it trusts is another party
      # who can change what ships.
      #
      # UNVERIFIED. The arm64 leg has never run here. What is known to work is
      # the local recipe in the Makefile, on a Windows host with the ARM64 and
      # clang components installed. Treat a green run as evidence, not proof.
      - name: Build (windows arm64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          set PATH=%VSPATH%\VC\Tools\Llvm\bin;%PATH%
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Build
        if: matrix.target != 'aarch64-pc-windows-msvc'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/vulnhash${{ matrix.ext }}" \
             "dist/vulnhash-${version}-${{ matrix.platform }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vulnhash-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Written to a temp file first so the glob cannot pick up the file being
      # written, and so a partial run cannot leave a half-built list behind.
      - name: Generate checksums
        run: |
          cd dist
          sha256sum vulnhash-* > ../checksums.txt.tmp
          mv ../checksums.txt.tmp checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
